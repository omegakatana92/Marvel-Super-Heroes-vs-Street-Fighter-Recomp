# Marvel Super Heroes vs. Street Fighter (Capcom 1997, CPS-2 arcade board): per-game settings read by
# the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Marvel Super Heroes vs. Street Fighter
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel Super Heroes vs. Street Fighter Recomp
id = mshvsf
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.mshvsf
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `mshvsf` is MAME's parent set (Europe 970625); its clones (mshvsfu, mshvsfu1, mshvsfj, mshvsfj1,
# mshvsfj2, mshvsfh, mshvsfa, mshvsfa1, mshvsfb) are built from the same board and are not accepted.
rom_set = mshvsf
rom_parent = mshvsf
rom_name = Marvel Super Heroes Vs. Street Fighter (Europe 970625)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB). graphics: four files side by
# side per row (64-bit words), two rows of 4 MiB files (32 MiB in all): mvs.13m/15m/17m/19m, then
# mvs.14m/16m/18m/20m, and the region is populated from 0. sound_program: the Z80's ROMs (mvs.01,
# mvs.02). samples: the QSound chip's (mvs.11m, mvs.12m, 8 MiB). key: the board's cipher key.
program = mvse.03f:b72dc199 mvse.04f:6ef799f9 mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98
graphics = mvs.13m:29b05fd9 mvs.15m:faddccf1 mvs.17m:97aaf4c7 mvs.19m:cb70e915 mvs.14m:b3b1972d mvs.16m:08aadb5d mvs.18m:c1228b35 mvs.20m:366cc6c2
sound_program = mvs.01:68252324 mvs.02:b34e773d
samples = mvs.11m:86219770 mvs.12m:f2fd7f68
key = mshvsf.key:64660867

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
